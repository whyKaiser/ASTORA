<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTORA</title><link rel="stylesheet" href="/console.css"><script defer src="/ui-text.js"></script><script defer src="/ui-catalog.js"></script><script defer src="/ui-model.js"></script><script defer src="/ui-input.js"></script><script defer src="/console.js"></script></head>
<body data-view="store">
<header class="store-header">
 <div class="brand"><img src="/assets/astora-logo.png" alt="ASTORA"><span>ASTORA</span></div>
 <nav id="navigation"><button id="nav-store" class="nav-button active"><span id="label-store">المتجر</span></button><button id="nav-library" class="nav-button"><span id="label-library">مكتبتي</span></button><button id="nav-jobs" class="nav-button"><span id="label-jobs">التنزيلات</span></button><button id="nav-sources" class="nav-button"><span id="label-sources">المصادر</span></button></nav>
 <div class="preferences"><button id="motion" class="quiet-button">تقليل الحركة</button><button id="language" class="quiet-button">English</button></div>
</header>
<main>
<section id="view-catalog" class="catalog-view">
 <div class="catalog-toolbar"><div class="catalog-heading"><span id="catalog-kicker">اكتشف لعبتك التالية</span><strong id="catalog-title">الألعاب والتطبيقات</strong><span id="count" class="count">0</span></div><div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="ابحث عن لعبة أو تطبيق" aria-label="ابحث عن لعبة أو تطبيق"><button id="clear-search" class="clear-search" aria-label="مسح البحث">×</button></div></div>
 <div id="feature" class="spotlight"><div class="hero-media"><img id="feature-image" src="/covers/srb2.png" alt=""></div><div class="hero-shade"></div><div class="hero-copy" id="feature-copy"><div class="hero-tags"><span id="feature-platform">PS4</span><span id="feature-kind">لعبة</span><span id="feature-size" dir="ltr"></span></div><h1 id="feature-title" dir="auto">ASTORA</h1><p id="feature-description"></p><div class="hero-actions"><button id="feature-open" class="primary" disabled><span id="feature-action-label">عرض اللعبة</span><span aria-hidden="true">←</span></button><button id="feature-save" class="secondary"><span class="heart" aria-hidden="true">♡</span><span id="feature-save-label">إضافة إلى مكتبتي</span></button></div><div class="hero-bottom"><span id="feature-source"></span><span id="feature-number" dir="ltr"></span></div></div></div>
 <div class="collection-toolbar"><div id="platforms" class="platforms"></div><div class="pager"><button id="previous" class="page-button" aria-label="السابق">‹</button><span id="page" dir="ltr">1 / 1</span><button id="next" class="page-button" aria-label="التالي">›</button></div></div>
 <p id="platform-note" class="platform-note"></p><div id="cards" class="cards"></div>
 <div id="empty-library" class="empty-state" hidden><h2 id="empty-title">مكتبتك تبدأ من هنا</h2><p id="empty-description"></p><button id="reset-filter" class="secondary">عرض الكل</button><button id="empty-add-source" class="primary">إضافة مكتبة</button></div>
</section>
<section id="view-jobs" class="panel-view" hidden><div class="page-heading"><div><span id="jobs-kicker" class="eyebrow">جاهز للعب</span><h1 id="jobs-title">التنزيلات</h1><p id="jobs-note"></p></div><button id="refresh-jobs" class="secondary">تحديث</button></div><div id="jobs" aria-live="polite"></div></section>
<section id="view-sources" class="panel-view" hidden>
 <div class="page-heading"><div><span id="sources-kicker" class="eyebrow">كل مكتباتك، في مكان واحد</span><h1 id="sources-title">إدارة المصادر</h1><p id="sources-description"></p></div></div>
 <div class="source-tabs"><button id="source-tab-url" class="secondary active">رابط مكتبة</button><button id="source-tab-usb" class="secondary">من الفلاش</button><button id="source-tab-game" class="secondary">إضافة لعبة</button></div>
 <div class="source-editor" id="source-url-panel"><form id="source-form"><label for="source-url" id="source-label">رابط ملف المكتبة</label><div class="input-row"><input id="source-url" type="url" dir="ltr" placeholder="https://raw.githubusercontent.com/…/catalog.json" required><button id="import" class="primary" type="submit">استيراد المكتبة</button></div></form><p id="source-limit" class="note"></p></div>
 <div class="source-editor" id="source-usb-panel" hidden><div class="usb-heading"><p id="usb-help"></p><button id="refresh-usb" class="secondary">فحص الفلاش</button></div><div id="usb-list"></div></div>
 <div class="source-editor" id="source-game-panel" hidden><form id="game-form"><div class="form-grid"><label><span id="game-name-label">اسم اللعبة أو التطبيق</span><input id="game-name" maxlength="160" required></label><label><span id="game-url-label">رابط حزمة PKG</span><input id="game-url" type="url" dir="ltr" placeholder="https://github.com/…/game.pkg" required></label></div><div class="input-row"><label class="game-type-label"><span id="game-kind-label">النوع</span><select id="game-kind"><option value="game">لعبة</option><option value="app">تطبيق</option></select></label><button id="add-game" class="primary" type="submit">فحص وإضافة</button></div></form><p id="game-help" class="note"></p></div>
 <p id="source-result" class="feedback" role="status"></p><div class="section-heading"><h2 id="source-list-title">المكتبات المضافة</h2><span id="source-count"></span></div><div id="source-list" class="source-list"></div>
</section>
</main>
<footer><div class="connection"><span id="status-dot" class="status-dot"></span><span id="status" role="status">جار الاتصال…</span></div><span id="controls">الأسهم للتنقل · × للاختيار · ○ للخروج</span><span class="edition" dir="ltr">ASTORA 0.6.0 · PS4</span></footer>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden><div class="game-page"><button id="close" class="close" aria-label="إغلاق">×</button><div class="detail-cover"><img id="detail-image" src="/assets/astora-logo.png" alt=""><span id="detail-platform">PS4</span></div><div class="detail-content"><span id="detail-kicker" class="eyebrow">تفاصيل اللعبة</span><h2 id="detail-title" dir="auto"></h2><p id="detail-description"></p><div class="detail-facts"><div><span id="size-label">حجم الحزمة</span><strong id="detail-size" dir="ltr"></strong></div><div><span id="source-detail-label">المصدر</span><strong id="detail-source" dir="auto"></strong></div></div><div id="mirror-list" class="mirror-list"></div><div id="detail-status" class="detail-status" role="status"></div><div class="actions"><button id="inspect" class="secondary">فحص المصدر</button><button id="install" class="primary" disabled>تنزيل وتثبيت</button><button id="detail-save" class="save-button" aria-label="إضافة إلى مكتبتي">♡</button></div><button id="view-transfer" class="text-button" hidden>متابعة التنزيل</button></div></div></div>
</body></html>
